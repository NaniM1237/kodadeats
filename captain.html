<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KodadEats Captain - Delivery Partner App</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <!-- Leaflet CSS for Rider GPS Map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .pulse-ring { animation: pulseRing 1.5s infinite; }
    @keyframes pulseRing {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 14px rgba(37, 99, 235, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(37, 99, 235, 0); }
    }
    #captainMap { height: 210px; width: 100%; border-radius: 1rem; z-index: 10; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen antialiased select-none pb-12">

  <!-- ================= CAPTAIN APP CONTAINER (MOBILE CARD LOOK) ================= -->
  <div class="max-w-md mx-auto px-4 py-4 space-y-4">

    <!-- Captain Header & Profile -->
    <div class="bg-slate-800/90 border border-slate-700 rounded-3xl p-4 shadow-xl space-y-3">
      
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-12 h-12 rounded-2xl bg-blue-600 flex items-center justify-center text-2xl shadow-md shadow-blue-500/30">
            🛵
          </div>
          <div>
            <div class="flex items-center gap-2">
              <h2 id="captainName" class="text-base font-black text-white">Ramesh G.</h2>
              <span class="bg-blue-500/20 text-blue-400 text-[10px] font-bold px-2 py-0.5 rounded-full border border-blue-500/30">Captain #1</span>
            </div>
            <p id="captainVehicle" class="text-xs text-slate-400">Hero Splendor (TS-05-AB-1234)</p>
          </div>
        </div>

        <!-- Captain Switcher Dropdown (For Testing) -->
        <select id="captainSelect" onchange="switchCaptain(this.value)" class="bg-slate-700 text-white text-xs font-bold px-2.5 py-1.5 rounded-xl border border-slate-600 focus:outline-none">
          <option value="cap-1" selected>Ramesh G.</option>
          <option value="cap-2">Suresh K.</option>
          <option value="cap-3">Venkatesh M.</option>
        </select>
      </div>

      <!-- Online / Offline Duty Switch -->
      <div class="flex items-center justify-between p-3 bg-slate-900/80 rounded-2xl border border-slate-700/60">
        <div class="flex items-center gap-2">
          <span id="dutyIndicator" class="w-3 h-3 rounded-full bg-emerald-400 animate-pulse"></span>
          <div>
            <span id="dutyStatusText" class="text-xs font-black text-white block">ON DUTY (Ready in Kodad)</span>
            <span class="text-[10px] text-slate-400">Receiving instant dispatch alerts</span>
          </div>
        </div>
        <button onclick="toggleDuty()" id="dutyBtn" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-black px-3.5 py-1.5 rounded-xl shadow-sm transition">
          Go Offline
        </button>
      </div>

      <!-- Quick Earnings & Stats Cards -->
      <div class="grid grid-cols-3 gap-2 text-center text-xs">
        <div class="bg-slate-900/60 p-2.5 rounded-xl border border-slate-700/60">
          <span class="text-slate-400 text-[10px] block font-semibold">Today's Trips</span>
          <span id="statTripsCount" class="text-base font-black text-white mt-0.5 block">6</span>
        </div>
        <div class="bg-slate-900/60 p-2.5 rounded-xl border border-slate-700/60">
          <span class="text-slate-400 text-[10px] block font-semibold">Earnings (₹)</span>
          <span id="statEarnings" class="text-base font-black text-emerald-400 mt-0.5 block">₹240</span>
        </div>
        <div class="bg-slate-900/60 p-2.5 rounded-xl border border-slate-700/60">
          <span class="text-slate-400 text-[10px] block font-semibold">Rider Rating</span>
          <span class="text-base font-black text-amber-400 mt-0.5 block">★ 4.9</span>
        </div>
      </div>

    </div>

    <!-- Active Delivery Task (Or Idle State) -->
    <div id="activeTaskContainer"></div>

    <!-- Past Deliveries History -->
    <div class="bg-slate-800/60 border border-slate-700 rounded-3xl p-4 shadow-xl space-y-3">
      <h3 class="font-extrabold text-sm text-white flex items-center justify-between">
        <span>Recent Deliveries in Kodad</span>
        <span class="text-[10px] font-semibold text-slate-400">₹40 per delivery payout</span>
      </h3>
      <div id="historyList" class="space-y-2 text-xs"></div>
    </div>

  </div>

  <script src="data.js"></script>
  <script src="realtime-sync.js"></script>
  <script>
    let currentCaptainId = 'cap-1';
    let isOnDuty = true;
    let completedDeliveries = 6;
    let todayEarnings = 240;
    let captainMap = null;

    document.addEventListener('DOMContentLoaded', () => {
      loadCaptainUI();
      checkAssignedDeliveries();
      initCaptainRealtime();
    });

    function switchCaptain(capId) {
      currentCaptainId = capId;
      loadCaptainUI();
      checkAssignedDeliveries();
    }

    function loadCaptainUI() {
      const cap = KODAD_DATA.captains.find(c => c.id === currentCaptainId) || KODAD_DATA.captains[0];
      document.getElementById('captainName').textContent = cap.name;
      document.getElementById('captainVehicle').textContent = cap.vehicle;
    }

    function toggleDuty() {
      isOnDuty = !isOnDuty;
      const dutyIndicator = document.getElementById('dutyIndicator');
      const statusText = document.getElementById('dutyStatusText');
      const btn = document.getElementById('dutyBtn');

      if (isOnDuty) {
        dutyIndicator.className = 'w-3 h-3 rounded-full bg-emerald-400 animate-pulse';
        statusText.textContent = 'ON DUTY (Ready in Kodad)';
        btn.textContent = 'Go Offline';
        btn.className = 'bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-black px-3.5 py-1.5 rounded-xl shadow-sm transition';
      } else {
        dutyIndicator.className = 'w-3 h-3 rounded-full bg-red-500';
        statusText.textContent = 'OFF DUTY (Paused)';
        btn.textContent = 'Go Online';
        btn.className = 'bg-slate-700 hover:bg-slate-600 text-white text-xs font-black px-3.5 py-1.5 rounded-xl shadow-sm transition';
      }
      checkAssignedDeliveries();
    }

    function checkAssignedDeliveries() {
      const container = document.getElementById('activeTaskContainer');
      const orders = RealtimeBus.getAllOrders();

      if (!isOnDuty) {
        container.innerHTML = `
          <div class="bg-slate-800/60 border border-slate-700 rounded-3xl p-8 text-center text-slate-400 space-y-2">
            <span class="text-4xl block">💤</span>
            <h4 class="font-bold text-sm text-white">You are Currently Offline</h4>
            <p class="text-xs">Click 'Go Online' above to start receiving deliveries in Kodad.</p>
          </div>
        `;
        return;
      }

      const activeOrder = orders.find(o => 
        (o.status === 'CAPTAIN_ASSIGNED' || o.status === 'PICKED_UP') && 
        o.captain && o.captain.id === currentCaptainId
      );

      if (!activeOrder) {
        container.innerHTML = `
          <div class="bg-slate-800/90 border border-slate-700 rounded-3xl p-8 text-center text-slate-400 space-y-3 shadow-xl">
            <div class="w-16 h-16 rounded-full bg-blue-600/20 text-blue-400 flex items-center justify-center text-3xl mx-auto pulse-ring">
              📍
            </div>
            <h4 class="font-black text-base text-white">Searching for Nearby Deliveries</h4>
            <p class="text-xs text-slate-400 max-w-xs mx-auto">
              Stay near Khammam X Road, Bus Stand or Gandhi Chowk in Kodad. A loud alert chime will ring when an order is assigned!
            </p>
          </div>
        `;
        return;
      }

      const isPickedUp = activeOrder.status === 'PICKED_UP';
      const isCOD = activeOrder.paymentMethod.includes('Cash');

      container.innerHTML = `
        <div class="bg-slate-800 border-2 border-blue-500 rounded-3xl p-4 md:p-5 shadow-2xl space-y-4 animate-in fade-in zoom-in-95">
          
          <div class="flex items-center justify-between pb-3 border-b border-slate-700">
            <div>
              <span class="bg-blue-600 text-white text-[10px] font-black px-2.5 py-0.5 rounded-full uppercase tracking-wider">
                ${isPickedUp ? '🚀 En Route to Customer' : '🔔 Pick Up Required'}
              </span>
              <h3 class="text-lg font-black text-white mt-1">Order #${activeOrder.id}</h3>
            </div>
            <div class="text-right">
              <span class="text-xs text-slate-400 block font-semibold">Your Payout</span>
              <span class="text-emerald-400 font-black text-sm">₹40.00</span>
            </div>
          </div>

          <!-- Live Route Map for Rider -->
          <div class="relative">
            <div id="captainMap"></div>
            <div class="absolute bottom-2 left-2 z-[400] bg-slate-900/90 text-white px-2 py-0.5 rounded text-[10px] font-bold">
              🗺️ Live Kodad Route
            </div>
          </div>

          <!-- 1. Restaurant Pickup -->
          <div class="bg-slate-900/90 p-3 rounded-2xl border border-slate-700/80 space-y-2">
            <div class="flex items-start justify-between">
              <div class="flex items-start gap-2.5">
                <span class="text-xl">🏪</span>
                <div>
                  <span class="text-[10px] uppercase font-bold text-blue-400 block">Pickup Location (Kitchen)</span>
                  <h4 class="font-black text-sm text-white">${activeOrder.restaurant.name}</h4>
                  <p class="text-xs text-slate-400">${activeOrder.restaurant.name}, Kodad</p>
                </div>
              </div>
              <a href="https://maps.google.com/?q=${encodeURIComponent(activeOrder.restaurant.name + ' Kodad')}" target="_blank" class="bg-slate-800 hover:bg-slate-700 text-blue-400 font-bold text-xs p-2 rounded-xl border border-slate-700 flex items-center gap-1 transition">
                🗺️ Maps
              </a>
            </div>
            <div class="text-[11px] text-slate-300 pt-1 border-t border-slate-800">
              <span>Items: <b>${activeOrder.items.map(i => `${i.quantity}x ${i.name}`).join(', ')}</b></span>
            </div>
          </div>

          <!-- 2. Customer Drop -->
          <div class="bg-slate-900/90 p-3 rounded-2xl border border-slate-700/80 space-y-2">
            <div class="flex items-start justify-between">
              <div class="flex items-start gap-2.5">
                <span class="text-xl">📍</span>
                <div>
                  <span class="text-[10px] uppercase font-bold text-emerald-400 block">Delivery Drop (Customer)</span>
                  <h4 class="font-black text-sm text-white">${activeOrder.customer.name}</h4>
                  <p class="text-xs text-slate-300">${activeOrder.customer.address}</p>
                  <p class="text-xs font-bold text-blue-400">Landmark: ${activeOrder.customer.landmark}</p>
                </div>
              </div>
              <div class="flex items-center gap-1.5">
                <a href="https://wa.me/91${activeOrder.customer.phone.replace(/\\D/g, '').slice(-10)}?text=${encodeURIComponent('Hello ' + activeOrder.customer.name + ', I am your KodadEats Captain. I am on the way with your food to ' + activeOrder.customer.landmark + '!')}" target="_blank" class="bg-emerald-600 hover:bg-emerald-700 text-white font-black text-xs px-2.5 py-2 rounded-xl shadow-sm flex items-center gap-1 transition">
                  <span>💬 WA</span>
                </a>
                <a href="tel:${activeOrder.customer.phone}" class="bg-blue-600 hover:bg-blue-700 text-white font-black text-xs px-3 py-2 rounded-xl shadow-sm flex items-center gap-1 transition">
                  <span>📞 Call</span>
                </a>
              </div>
            </div>
          </div>

          <!-- 3. Payment Notice -->
          <div class="p-3 rounded-2xl ${isCOD ? 'bg-amber-950/40 border border-amber-500/50' : 'bg-emerald-950/40 border border-emerald-500/50'} flex items-center justify-between text-xs">
            <div>
              <span class="text-slate-400 block font-semibold">Payment to Collect:</span>
              <span class="font-black text-sm ${isCOD ? 'text-amber-400' : 'text-emerald-400'}">
                ${isCOD ? `Collect Cash: ₹${activeOrder.total}` : 'Paid Online (Do not collect cash)'}
              </span>
            </div>
            <span class="text-2xl">${isCOD ? '💵' : '✅'}</span>
          </div>

          <!-- 4. Action Button -->
          <div class="pt-2">
            ${!isPickedUp ? `
              <button onclick="captainConfirmPickup('${activeOrder.id}')" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-3.5 px-4 rounded-2xl shadow-lg shadow-blue-600/30 transition flex items-center justify-center gap-2 text-sm">
                <span>📦 I Have Picked Up Food from Kitchen</span>
              </button>
            ` : `
              <button onclick="captainConfirmDelivered('${activeOrder.id}')" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black py-3.5 px-4 rounded-2xl shadow-lg shadow-emerald-600/30 transition flex items-center justify-center gap-2 text-sm animate-pulse">
                <span>✓ Delivered to Customer (Complete Trip)</span>
              </button>
            `}
          </div>

        </div>
      `;

      setTimeout(() => {
        initCaptainMap(activeOrder);
      }, 200);
    }

    function initCaptainMap(order) {
      const rest = KODAD_DATA.restaurants.find(r => r.id === order.restaurant.id) || KODAD_DATA.restaurants[0];
      const landmark = KODAD_DATA.landmarks.find(l => l.name === order.customer.landmark) || KODAD_DATA.landmarks[0];

      if (!captainMap) {
        captainMap = L.map('captainMap').setView([KODAD_DATA.center.lat, KODAD_DATA.center.lng], 14);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          attribution: '© OpenStreetMap'
        }).addTo(captainMap);
      } else {
        captainMap.invalidateSize();
      }

      captainMap.eachLayer((layer) => {
        if (layer instanceof L.Marker || layer instanceof L.Polyline) {
          captainMap.removeLayer(layer);
        }
      });

      const restIcon = L.divIcon({
        html: `<div style="background-color:#2563eb; color:white; border-radius:50%; width:30px; height:30px; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 10px rgba(0,0,0,0.3); border:2px solid white; font-size:16px;">🏪</div>`,
        iconSize: [30, 30]
      });

      const custIcon = L.divIcon({
        html: `<div style="background-color:#ef4444; color:white; border-radius:50%; width:30px; height:30px; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 10px rgba(0,0,0,0.3); border:2px solid white; font-size:16px;">📍</div>`,
        iconSize: [30, 30]
      });

      L.marker([rest.lat, rest.lng], { icon: restIcon }).addTo(captainMap).bindPopup(`<b>${rest.name}</b> (Pickup)`);
      L.marker([landmark.lat, landmark.lng], { icon: custIcon }).addTo(captainMap).bindPopup(`<b>${order.customer.name}</b> (${landmark.name})`);

      L.polyline([[rest.lat, rest.lng], [landmark.lat, landmark.lng]], { color: '#2563eb', weight: 4, dashArray: '6, 6' }).addTo(captainMap);
      captainMap.fitBounds(L.latLngBounds([rest, landmark]), { padding: [30, 30] });
    }

    function captainConfirmPickup(orderId) {
      RealtimeBus.markPickedUp(orderId);
      checkAssignedDeliveries();
    }

    function captainConfirmDelivered(orderId) {
      RealtimeBus.markDelivered(orderId);
      completedDeliveries++;
      todayEarnings += 40;

      document.getElementById('statTripsCount').textContent = completedDeliveries;
      document.getElementById('statEarnings').textContent = `₹${todayEarnings}`;

      confetti({ particleCount: 80, spread: 60, origin: { y: 0.6 } });

      checkAssignedDeliveries();
      renderHistory();
    }

    function renderHistory() {
      const list = document.getElementById('historyList');
      const orders = RealtimeBus.getAllOrders().filter(o => o.status === 'DELIVERED');
      
      if (orders.length === 0) {
        list.innerHTML = `<div class="p-2.5 bg-slate-900/60 rounded-xl text-slate-400 text-center">No completed trips yet today.</div>`;
        return;
      }

      list.innerHTML = orders.map(o => `
        <div class="p-3 bg-slate-900/80 rounded-2xl border border-slate-700/60 flex items-center justify-between">
          <div>
            <span class="font-bold text-white block">#${o.id} • ${o.restaurant.name}</span>
            <span class="text-slate-400 text-[11px]">To: ${o.customer.landmark}</span>
          </div>
          <span class="font-black text-emerald-400 text-xs">+₹40.00</span>
        </div>
      `).join('');
    }

    function initCaptainRealtime() {
      renderHistory();
      RealtimeBus.on((event) => {
        if (event.type === 'CAPTAIN_ASSIGNED') {
          RealtimeBus.Sounds.playRiderAlert();
          checkAssignedDeliveries();
        }
        if (event.type === 'ORDER_PICKED_UP' || event.type === 'ORDER_DELIVERED') {
          checkAssignedDeliveries();
          renderHistory();
        }
      });
    }
  </script>
</body>
</html>
