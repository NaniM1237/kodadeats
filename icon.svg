<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#7c2d12" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background Rounded App Tile -->
  <rect width="512" height="512" rx="120" fill="url(#bg)"/>
  
  <!-- Food Delivery Scooter Graphic -->
  <g filter="url(#shadow)" fill="#ffffff" transform="translate(64, 80) scale(0.75)">
    <!-- Delivery Box on back -->
    <rect x="70" y="140" width="110" height="110" rx="16" fill="#ffffff"/>
    <rect x="85" y="155" width="80" height="40" rx="8" fill="#f97316"/>
    <text x="125" y="180" font-family="Arial, sans-serif" font-weight="900" font-size="20" fill="#ffffff" text-anchor="middle">KZ</text>
    
    <!-- Bike Body -->
    <path d="M170 230 L260 230 L310 160 L360 160 L370 180 L330 180 L290 240 L310 280 L180 280 Z" fill="#ffffff"/>
    <!-- Handlebar & Windshield -->
    <line x1="335" y1="170" x2="360" y2="120" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>
    <line x1="340" y1="120" x2="380" y2="120" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>
    <circle cx="375" cy="140" r="14" fill="#fef08a"/>
    
    <!-- Rear Wheel -->
    <circle cx="150" cy="330" r="60" fill="#18181b"/>
    <circle cx="150" cy="330" r="32" fill="#ffffff"/>
    <circle cx="150" cy="330" r="14" fill="#ea580c"/>
    
    <!-- Front Wheel -->
    <circle cx="360" cy="330" r="60" fill="#18181b"/>
    <circle cx="360" cy="330" r="32" fill="#ffffff"/>
    <circle cx="360" cy="330" r="14" fill="#ea580c"/>
    
    <!-- Speed Lines -->
    <line x1="20" y1="170" x2="50" y2="170" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
    <line x1="10" y1="210" x2="45" y2="210" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
    <line x1="30" y1="250" x2="55" y2="250" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
  </g>
  
  <!-- Text Label -->
  <text x="256" y="445" font-family="Arial, sans-serif" font-weight="900" font-size="52" fill="#ffffff" text-anchor="middle" letter-spacing="3">KZIP</text>
</svg>
